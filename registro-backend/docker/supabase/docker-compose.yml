version: '3.8'

services:
  db:
    image: supabase/postgres:15.1.0.147
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # In a full Supabase local setup, we would add:
  # - Kong (API Gateway)
  # - GoTrue (Auth)
  # - PostgREST (API)
  # - Realtime
  # - Storage
  # - Studio
  # For brevity in this task, we focus on the Database core with extensions enabled.
  # Use `npx supabase start` for the full experience.

volumes:
  pg_data:
