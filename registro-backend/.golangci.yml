version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    exclude-functions:
      # Standard library resource cleanup - idiomatic Go, safe to ignore
      - (*database/sql.Rows).Close
      - (*database/sql.DB).Close
      - (*database/sql.Tx).Rollback
      - (*database/sql.Stmt).Close
      - (*os.File).Close
      - os.Setenv
      - os.Unsetenv
