name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SERVER_MODE: release
      JWT_SECRET: ci-test-secret-not-used-in-production-64chars-xxxxxxxxxxx
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PEPPER_SECRET: ci-only-pepper-value-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.out"
          retention-days: 7
