openapi: 3.0.3
info:
  title: Registro Elettronico V2 API
  description: API REST per la gestione scolastica (Auth, Utenti, Voti, Presenze, Comunicazioni, Documenti, Colloqui, Agenda).
  version: 0.8.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
paths:
  /classes:
    get:
      summary: Lista classi scolastiche (supporta SuperAdmin globale e filtri multi-scuola)
      tags:
        - Classi
      security:
        - BearerAuth: []
      parameters:
        - name: academic_year
          in: query
          schema:
            type: string
        - name: school_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista classi
        '401':
          description: Non autorizzato
    post:
      summary: Creazione nuova classe
      tags:
        - Classi
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Classe creata
        '403':
          description: Permessi insufficienti
  /attendance/pending-justifications:
    get:
      summary: Lista giustificazioni in attesa di approvazione
      tags:
        - Presenze
      security:
        - BearerAuth: []
      parameters:
        - name: class_id
          in: query
          description: UUID della classe (opzionale per i docenti, default tutte le classi assegnate)
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista giustificazioni in sospeso
        '403':
          description: Accesso non autorizzato
  /auth/login:
    post:
      summary: Autenticazione utente
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login effettuato con successo (restituisce JWT access_token)
        '401':
          description: Credenziali non valide
  /auth/refresh:
    post:
      summary: Refresh token di accesso
      tags:
        - Auth
      responses:
        '200':
          description: Nuovo access_token generato
  /auth/register:
    post:
      summary: Registrazione nuovo utente (Richiede JWT con ruoli autorizzati)
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Utente creato
        '403':
          description: Permessi insufficienti
  /grades:
    post:
      summary: Inserimento nuovo voto (Docente)
      tags:
        - Voti
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Voto creato
  /grades/student/{studentID}:
    get:
      summary: Recupero voti per uno studente
      tags:
        - Voti
      parameters:
        - name: studentID
          in: path
          required: true
          schema:
            type: string
        - name: semester
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Lista voti o risposta paginata
  /grades/my-grades:
    get:
      summary: Voti dello studente loggato
      tags:
        - Voti
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Riepilogo voti studente
  /attendance/entry:
    post:
      summary: Registrazione presenza/assenza (Docente)
      tags:
        - Presenze
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Presenza registrata
  /parents/dashboard:
    get:
      summary: Dashboard Genitore
      tags:
        - Genitori
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Panoramica figli, medie e comunicazioni
  /auth/mfa/setup:
    post:
      summary: Inizializza setup TOTP 2FA
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Secret TOTP e QR code URI
  /auth/mfa/verify:
    post:
      summary: Verifica codice 2FA e attiva MFA
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: MFA attivato
  /colloqui/slots:
    get:
      summary: Lista slot colloqui disponibili
      tags:
        - Colloqui
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista slot
  /pdp:
    get:
      summary: Lista piani didattici personalizzati (PDP/PEI)
      tags:
        - Inclusione
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista piani PDP
  /reports/grades/excel:
    get:
      summary: Export matrice voti in formato Excel XLSX
      tags:
        - Report
      security:
        - BearerAuth: []
  /public/accessibility-feedback:
    post:
      summary: Invia segnalazione barriera digitale (AgID / WCAG 2.2)
      tags:
        - Accessibilità
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - barrier_type
                - description
              properties:
                name:
                  type: string
                  example: Mario Rossi
                email:
                  type: string
                  format: email
                  example: mario.rossi@example.com
                barrier_type:
                  type: string
                  enum: [contrast, keyboard, tts, documents, other]
                  example: contrast
                description:
                  type: string
                  example: Contrasto visivo insufficiente nelle circolari.
      responses:
        '201':
          description: Segnalazione registrata con protocollo AgID
        '400':
          description: Errore di validazione
  /admin/accessibility-feedbacks:
    get:
      summary: Lista segnalazioni di accessibilità (Admin / RTD)
      tags:
        - Accessibilità
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista segnalazioni e totale
        '403':
          description: Permessi insufficienti
  /teachers/registro-personale/pdf:
    get:
      summary: Esporta Registro Personale del Docente in PDF
      tags:
        - Docenti
      security:
        - BearerAuth: []
      parameters:
        - name: class_id
          in: query
          required: true
          schema:
            type: string
        - name: subject_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File PDF del registro personale
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Parametri mancanti
        '403':
          description: Permessi insufficienti
  /classes/{id}/giornale-mensile/pdf:
    get:
      summary: Esporta Giornale di Classe Mensile Ufficiale in PDF
      tags:
        - Classi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File PDF del giornale mensile
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: Permessi insufficienti
  /admin/data-integrity:
    get:
      summary: Verifica e diagnostica congruita dati scolastici
      tags:
        - Amministrazione
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Risultato scansione anomalie del database
        '403':
          description: Riservato ad amministratori e segreteria
  /live:
    get:
      summary: Kubernetes Liveness Probe
      tags:
        - Sistema
      responses:
        '200':
          description: Server attivo
  /ready:
    get:
      summary: Kubernetes Deep Readiness Probe
      tags:
        - Sistema
      responses:
        '200':
          description: Connessioni DB, Redis e runtime operative
        '503':
          description: Servizio non pronto o dipendenze non raggiungibili
  /agenda/{id}/complete:
    post:
      summary: Contrassegna compito come completato
      tags:
        - Agenda
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Segnato come completato
    delete:
      summary: Rimuove completamento compito
      tags:
        - Agenda
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completamento rimosso
  /reports/dropout-risk:
    get:
      summary: Calcola indice di rischio dispersione scolastica
      tags:
        - Reportistica
      security:
        - BearerAuth: []
      parameters:
        - name: class_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Indice rischio studenti e indicatori
  /admin/gdpr/retention:
    post:
      summary: Esegue pseudonimizzazione dati studenti ai sensi del GDPR
      tags:
        - Amministrazione
      security:
        - BearerAuth: []
  /rooms/buildings:
    get:
      summary: Lista plessi scolastici
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Elenco dei plessi scolastici
    post:
      summary: Creazione nuovo plesso scolastico
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Plesso scolastico creato
  /rooms:
    get:
      summary: Lista aule e laboratori (supporta filtri per plesso, tipo e disponibilità)
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      parameters:
        - name: building_id
          in: query
          schema:
            type: string
        - name: room_type
          in: query
          schema:
            type: string
        - name: only_bookable
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Elenco delle aule
    post:
      summary: Creazione nuova aula o laboratorio prenotabile
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Aula creata con successo
  /rooms/{id}/availability:
    get:
      summary: Verifica disponibilità aula per data e slot orario
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: time_slot
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Disponibilità aula verificata
  /rooms/bookings:
    get:
      summary: Lista prenotazioni aule attive
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Elenco delle prenotazioni
    post:
      summary: Effettua prenotazione aula per classe e ora (spot o ricorrente)
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Prenotazione effettuata con successo
        '409':
          description: Conflitto di prenotazione (aula già occupata)
  /rooms/bookings/{id}:
    delete:
      summary: Annullamento prenotazione aula
      tags:
        - Aule e Plessi
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prenotazione annullata
  /timetable/generate:
    post:
      summary: Avvia generazione orario scolastico automatica con risolutore CSP e priorità anzianità
      tags:
        - Orario Scolastico
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Generazione orario avviata in background
  /timetable/generate/{jobID}:
    get:
      summary: Polling stato avanzamento calcolo orario
      tags:
        - Orario Scolastico
      security:
        - BearerAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stato del job e orario proposto
  /timetable/generate/{jobID}/publish:
    post:
      summary: Pubblicazione orario calcolato nelle tabelle ufficiali
      tags:
        - Orario Scolastico
      security:
        - BearerAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Orario pubblicato con successo
  /timetable/preferences:
    get:
      summary: Recupera desiderata orario docente
      tags:
        - Orario Scolastico
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Desiderata docente
    post:
      summary: Salva desiderata orario docente
      tags:
        - Orario Scolastico
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Desiderata salvati con successo
  /timetable/constraints:
    get:
      summary: Lista vincoli orario istituto e plessi
      tags:
        - Orario Scolastico
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Elenco vincoli orari
    post:
      summary: Salva vincoli orario istituto
      tags:
        - Orario Scolastico
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Vincoli salvati con successo
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

