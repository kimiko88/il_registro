name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./registro-backend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - run: go build -o registro-api ./cmd/api-server
      - uses: actions/upload-artifact@v3
        with:
          name: registro-api
          path: registro-backend/registro-api

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./registro-frontend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: registro-frontend/dist

  docker-build:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Build Backend Image
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./registro-backend
          file: ./registro-backend/docker/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }},ghcr.io/${{ github.repository }}-backend:latest

      # Build Frontend Image (Assuming Dockerfile exists or using generic nginx one)
      # If no Dockerfile in frontend, we might skip this or use a generic one.
      # For now, I'll comment it out or assume a standard one if present, 
      # but prompt implied single "docker-build" job. Splitting for safety.
      # - name: Build and push Frontend
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: ./registro-frontend
      #     push: true
      #     tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
