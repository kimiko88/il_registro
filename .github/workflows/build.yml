name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./registro-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: registro-frontend/dist

  docker-build:
    needs: [build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Convert repository name to lowercase for Docker tags
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # Build Backend Image
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./registro-backend
          file: ./registro-backend/docker/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}-backend:${{ github.sha }},ghcr.io/${{ env.REPO_LC }}-backend:latest

      # Build Frontend Image (Assuming Dockerfile exists or using generic nginx one)
      # If no Dockerfile in frontend, we might skip this or use a generic one.
      # For now, I'll comment it out or assume a standard one if present, 
      # but prompt implied single "docker-build" job. Splitting for safety.
      # - name: Build and push Frontend
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./registro-frontend
      #     push: true
      #     tags: ghcr.io/${{ env.REPO_LC }}-frontend:${{ github.sha }}
