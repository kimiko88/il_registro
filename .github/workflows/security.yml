name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  security-events: write
  contents: read

jobs:
  security-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./registro-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: securego/gosec@master
        with:
          args: "./registro-backend/..."

  security-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./registro-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # Run audit but don't fail the build — vulnerabilities are tracked as warnings
      - run: npm audit --production || true

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true
